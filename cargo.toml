[package]
name = "rust_cms"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (Rbatis + SQLite)
rbatis = "4.5"
rbs = "4.5"             # <--- 【必须添加这一行】
rbdc-sqlite = "4.5"

# Template Engine
tera = "1"

# Markdown
pulldown-cmark = "0.9"

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
anyhow = "1"
